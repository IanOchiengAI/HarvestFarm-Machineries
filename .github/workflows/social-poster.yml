name: Autonomous Social Media Poster

on:
  schedule:
    # 3:00 AM UTC = 6:00 AM EAT
    # 4:00 PM UTC = 7:00 PM EAT
    - cron: '0 3,16 * * *'
  workflow_dispatch: # Allows manual triggering from GitHub UI

jobs:
  post-to-facebook:
    runs-on: ubuntu-latest
    
    # We need contents: write permission to commit back to the repo
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Using default GITHUB_TOKEN is fine, but we must ensure it can push
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Poster Script
        env:
          # This pulls the token from your GitHub Repository Secrets
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
        run: node execution/social-poster.mjs

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Check if there are any changes (like the CSV being updated)
          if [[ -n "$(git status --porcelain)" ]]; then
            git add .
            git commit -m "🤖 Auto-updated content calendar status [skip ci]"
            git push
            echo "Changes pushed to repository."
          else
            echo "No changes to commit."
          fi
